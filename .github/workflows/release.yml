name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    uses: ./.github/workflows/ci.yml

  package:
    name: Package release artifacts
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUN_VERSION: "1.3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-deps
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build production bundles
        run: bun run build

      - name: Package artifacts and checksums
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          mkdir -p release-artifacts
          tar -czf "release-artifacts/betterwealth-web-${tag}.tar.gz" \
            apps/web/dist apps/web/server.ts apps/web/package.json
          tar -czf "release-artifacts/betterwealth-api-${tag}.tar.gz" \
            apps/api/dist packages/db/migrations
          cd release-artifacts
          sha256sum *.tar.gz > "SHA256SUMS-${tag}.txt"
          cat "SHA256SUMS-${tag}.txt"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-artifacts/* --clobber
